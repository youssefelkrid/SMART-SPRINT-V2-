<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOUSEF TV </title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="src/main.js" defer></script>
</head>

<body>

    <div class="flex min-h-screen bg-[#0e1116] text-white">


        <aside class="flex flex-col gap-4 w-[260px] bg-[#080b0e] p-4 border border-r-amber-600">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 flex items-center justify-center">
                    <img src="img/smart-tv.png" alt="">

                </div>
                <div>
                    <h1 class="font-bold text-lg">SMART STREAM</h1>
                    <p class="text-gray-500 text-[9px] tracking-[3px]">
                        LA TÉLÉ EN MOUVEMENT
                    </p>

                </div>
            </div>
            <div class="flex flex-row items-center gap-2">
                <img class="flex w-8 h-8" src="img/chercher (1).png" alt="">
                <input id="search" type="text" placeholder="chercher les catigorie"
                    class="bg-[#080b0e] p-2 rounded-lg text-sm mt-4 ">
            </div>
            <!-- ////////////////////////////////////================================= -->
            <div id="cards">

            </div>
        </aside>
        <aside class="flex flex-col w-[260px] bg-[#080b0e] p-4 gap-4">
            <div class="flex items-center gap-3">

                <div class="w-10 h-10 flex items-center justify-center">
                    <img src="img/televiseur-intelligent (1).png" alt="">


                </div>
                <div>
                    <h1 class="font-bold text-lg">chaînes disponibles</h1>
                    <p class="text-gray-500 text-[9px] tracking-[3px]">
                        LA TÉLÉ EN MOUVEMENT
                    </p>

                </div>
            </div>
            <div class="flex flex-col gap-3">
                <div class="flex flex-row gap-2">
                    <img class="w-7" src="img/chercher (1).png" alt="">
                    <input id="search-ch" type="text" placeholder="chercher les chaînes">
                </div>
                <button id="Ajoutercannal"
                    class="w-full h-[40px] bg-blue-900 text-white shadow rounded-md cursor-pointer hover:bg-blue-600">Ajouter
                    Channel</button>
                <div class="flex flex-row gap-2">
                    <button id="favorite"
                        class="w-full h-[40px] border border-white text-white shadow rounded-md cursor-pointer hover:bg-blue-900">favorite</button>
                    <button id="blacklist"
                        class="w-full h-[40px] border border-white text-white shadow rounded-md cursor-pointer hover:bg-blue-900">blacklist</button>
                </div>
            </div>
            <div id="chanls">

            </div>



        </aside>


        <main class="flex-1 p-6">
            <section id="player" class="w-full">
                <div id="screen"
                    class="w-full aspect-video bg-black rounded-2xl border border-gray-800 flex items-center justify-center">
                    <div class="text-center">
                        <h2 class="text-white text-xl font-bold">
                            serveur not fuound
                        </h2>
                        <p class="text-gray-500 text-sm mt-2">

                        </p>
                    </div>
                </div>

            </section>
            <section id="epg" class="mt-6 bg-[#171b20] border border-gray-800 pb-4">

            </section>

        </main>

    </div>

    <div id="loading" class="  hidden fixed inset-0   flex-col justify-center items-center text-center bg-slate-900 ">
        <div class="h-12 w-12 animate-spin rounded-full border-4 border-white border-t-green-700"></div>
        <p class="text-white">chargamnt .....</p>
    </div>
    <div id="popup" class="hidden  justify-center items-center  bg-black-100  fixed inset-0">
        <form id="form" class="bg-white p-6 w-96 rounded shadow">

            <h1 class="text-2xl font-bold text-center mb-4">ADD NEW channel</h1>

            <div class="mb-3">
                <label for="id" class="block">id</label>
                <input id="id" type="text" placeholder="id" class="border w-full p-2">
            </div>

            <div class="mb-3">
                <label for="name" class="block">name</label>
                <input id="name" type="text" placeholder="nom" class="border w-full p-2">
            </div>

            <div class="mb-3">
                <label for="prix" class="block">countryId</label>
                <input id="countryId" type="text" placeholder="countryId" class="border w-full p-2">
            </div>

            <div class="mb-3">
                <label for="img" class="block">logo</label>
                <input id="logo" type="text" placeholder="logo" class="border w-full p-2">
            </div>

            <div class="flex gap-2">
                <button id="btnAjouter" type="submit" class="bg-red-600 text-white p-2 w-full rounded">AJOUTER</button>
                <button id="btnfermer" type="button" class="bg-gray-300 p-2 w-full rounded">ANNULLER</button>
            </div>

        </form>
    </div>
</body>

</html>
